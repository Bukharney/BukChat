services:
  client:
    image: ghcr.io/bukharney/bukchat/client:latest
    container_name: bukchat_client
    restart: unless-stopped
    environment:
      - HOST=${HOST:-0.0.0.0}
    expose:
      - "4173"
    networks:
      - app_net
      - tunnel_net

  server:
    image: ghcr.io/bukharney/bukchat/server:latest
    container_name: bukchat_server
    restart: unless-stopped
    environment:
      - PORT=8080
      - GIN_MODE=release
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net
      - tunnel_net

  postgres:
    image: postgres:14-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
  tunnel_net:
    external: true

volumes:
  postgres_data: